name: Import reviewed CC0 Daily Routines PNGs

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-daily-routines-png.yml"
      - "tool/import_daily_routines_png.py"
      - "tool/validate_content.py"

permissions:
  contents: write
  pull-requests: read

jobs:
  import-pngs-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'content/daily-routines-png-refresh-20261023'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the import PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PNG processing dependency
        run: python -m pip install --disable-pip-version-check "Pillow>=10.4,<13"

      - name: Download reviewed CC0 image files and save repository PNGs
        run: python3 tool/import_daily_routines_png.py

      - name: Validate content, licensing metadata and unique image slots
        run: python3 tool/validate_content.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit the imported PNG files to this PR
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets/illustrations/vocabulary/
          git add -A -- assets/vocabulary/packs/daily_routines_a1_2026-10-18.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Store reviewed CC0 Daily Routines artwork as PNG"
          git push origin "HEAD:${BRANCH_NAME}"
