name: Import reviewed CC0 School Life PNGs

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-school-life-png.yml"
      - "tool/import_school_life_png.py"
      - "tool/validate_content.py"

permissions:
  contents: write
  pull-requests: read

jobs:
  import-pngs-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'content/school-life-semantic-images-20261026'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the import PR branch
        uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.ref }}
          token: \${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PNG processing dependency
        run: python -m pip install --disable-pip-version-check "Pillow>=10.4,<13"

      - name: Download reviewed CC0 image files and save repository PNGs
        run: python3 tool/import_school_life_png.py

      - name: Validate content, licensing metadata and unique image slots
        run: python3 tool/validate_content.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit imported images and pack metadata to this PR
        env:
          BRANCH_NAME: \${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets/illustrations/vocabulary/school-life-a1-semantic-photos-2026-10-26/
          git add -A -- assets/vocabulary/packs/school_life_a1_2026-10-18.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Refresh School Life images with reviewed CC0 PNGs"
          git push origin "HEAD:\${BRANCH_NAME}"
