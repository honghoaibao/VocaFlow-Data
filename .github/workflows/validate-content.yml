name: Validate published content

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Syntax-check direct image candidate tool
        run: python3 -m py_compile tool/find_image_candidates.py
      - name: Validate manifests, dates, statuses, IDs, images and HTTPS links
        run: python3 tool/validate_content.py
